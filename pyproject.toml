[project]
name = "unit-fix"
version = "0.1.0"
description = "Single-turn Python repair: patch a small function so hidden unit tests pass. Sandboxed exec grader, no LLM-as-judge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "devtechedge" }]
keywords = [
    "rl",
    "rlvr",
    "code-repair",
    "unit-test",
    "verifiable",
    "single-turn",
    "python",
    "sandbox",
]
dependencies = [
    "verifiers>=0.1.14,<0.2",
    "datasets",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["unit_fix.py"]
